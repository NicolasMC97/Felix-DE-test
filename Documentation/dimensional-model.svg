<text x="40" y="856" class="leg">fct_transfers uses dim_date three times: payment created, receipt created and payout completed.</text>
<text x="40" y="874" class="leg">Grain: fct_payments = payment, fct_transfers = payment with receipt (accumulating snapshot), fct_disbursements = payout attempt.</text>
