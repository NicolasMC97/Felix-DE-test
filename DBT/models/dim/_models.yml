version: 2

models:
  - name: dim_date
    description: "Calendar dimension, one row per day from 2026-01-01 to 2026-12-31. Covers all created_at / updated_at dates in payments, disbursements and receipts."
    columns:
      - name: date_key
        description: "Surrogate key in yyyymmdd format."
        data_tests:
          - unique
          - not_null
      - name: date_day
        description: "Calendar date."
        data_tests:
          - unique
          - not_null
      - name: year
        description: "Calendar year."
      - name: quarter
        description: "Calendar quarter (1-4)."
      - name: month
        description: "Month number (1-12)."
      - name: month_name
        description: "Month name in English."
      - name: month_start_date
        description: "First day of the month."
      - name: year_month
        description: "Year and month as YYYY-MM."
      - name: week_of_year
        description: "ISO week number."
      - name: week_start_date
        description: "Monday of the ISO week."
      - name: day_of_month
        description: "Day of the month (1-31)."
      - name: day_of_week
        description: "ISO day of week, 1 = Monday to 7 = Sunday."
      - name: day_name
        description: "Day name in English."
      - name: is_weekend
        description: "True for Saturday and Sunday."
      - name: is_month_end
        description: "True on the last day of the month."
