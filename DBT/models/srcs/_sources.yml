version: 2

sources:
  - name: remittances   
    description: "Raw production data replicated into BigQuery"
    
    # BigQuery-specific routing
    database: felix-technical-test    
    schema: felix_dataset             

    
    #freshness:
    #  warn_after: {count: 12, period: hour}
    #  error_after: {count: 24, period: hour}
    #loaded_at_field: _partitiontime # Or your specific ingestion timestamp column

    tables:
      - name: sales
        description: "Raw users table directly from the backend database."
        columns:
          - name: dia
            description: "day of the sale"
          - name: cantidad
            description: "quantity sell"
          - name: producto
            description: "definition of the product"
          - name: precio
            description: "prize"
